<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de La Habana, Cuba</title>
  <link rel="stylesheet" href="lib/leaflet/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100vh; background: #ccc; }
    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 220px;
    }
    .download-panel {
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 12px;
      max-width: 220px;
    }
    .download-panel label { display: block; margin-bottom: 4px; }
    .download-panel select { width: 100%; font-size: 12px; }
    .download-panel small { display: block; margin-top: 4px; color: #ccc; }
    .dp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }
    .dp-title { font-weight: bold; }
    .dp-toggle {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      border: none;
      border-radius: 3px;
      width: 20px;
      height: 20px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      flex: none;
    }
    .download-panel.collapsed { padding: 4px 8px; }
    .download-panel.collapsed .dp-body { display: none; }
    .pins-panel {
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 12px;
      max-width: 220px;
    }
    .pins-panel.collapsed { padding: 4px 8px; }
    .pins-panel.collapsed .pins-body { display: none; }
    .pins-form input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .pins-form select { width: 100%; font-size: 12px; margin-bottom: 4px; }
    .pins-form button {
      width: 100%;
      padding: 5px;
      font-size: 12px;
      cursor: pointer;
    }
    .pins-form button.active { background: #4caf50; color: #fff; border-color: #4caf50; }
    .pins-form .hint { display: block; margin-top: 4px; color: #ccc; }
    .pins-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: bold;
    }
    .pins-count { color: #ccc; font-weight: normal; }
    #pinList {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      max-height: 180px;
      overflow-y: auto;
    }
    #pinList.collapsed { display: none; }
    .routing-panel {
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 12px;
      max-width: 220px;
      max-height: 74vh;
      overflow-y: auto;
    }
    .routing-panel.collapsed { padding: 4px 8px; }
    .routing-panel.collapsed .routing-body { display: none; }
    .routing-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
    }
    .routing-row > span { flex: none; width: 56px; }
    .routing-btn {
      flex: 1;
      padding: 3px 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .routing-btn.active { background: #4caf50; color: #fff; border-color: #4caf50; }
    .routing-primary {
      width: 100%;
      padding: 5px;
      font-size: 12px;
      cursor: pointer;
      background: #2196f3;
      color: #fff;
      border: none;
      border-radius: 3px;
    }
    .routing-primary:disabled { opacity: 0.5; cursor: default; }
    .routing-body .hint {
      display: block;
      margin-top: 6px;
      color: #ccc;
      min-height: 14px;
    }
    .routing-row select {
      flex: 1;
      min-width: 0;
      padding: 2px;
      font-size: 11px;
    }
    #tspPinsList {
      max-height: 96px;
      overflow-y: auto;
      margin-bottom: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }
    #tspPinsList label {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 0;
      font-size: 11px;
      cursor: pointer;
    }
    #tspPinsList span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .routing-sep {
      height: 1px;
      background: rgba(255, 255, 255, 0.25);
      margin: 8px 0 6px;
    }
    .tsp-title {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    #routeLegend {
      margin-top: 4px;
      font-size: 10px;
      color: #ddd;
    }
    #routeLegend .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-right: 6px;
    }
    #routeLegend i {
      display: inline-block;
      width: 14px;
      height: 0;
      border-top-width: 3px;
      border-top-style: solid;
    }
    #pinList li {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }
    #pinList .pin-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    #pinList .pin-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pinList button {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
      flex: none;
    }
    .offline-status {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      max-width: 260px;
    }
    .offline-status .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #bbb;
      flex: none;
    }
    .offline-status.ready .dot { background: #4caf50; }
    .offline-status.downloading .dot {
      background: #ff9800;
      animation: offline-pulse 1s infinite;
    }
    .offline-status.empty .dot { background: #f44336; }
    @keyframes offline-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .offline-status .progress {
      flex: 1 0 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      overflow: hidden;
    }
    .offline-status .progress-bar {
      display: block;
      height: 100%;
      width: 0%;
      background: #ff9800;
      border-radius: 4px;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="controls">
    <div class="download-panel" id="downloadPanel">
      <div class="dp-header" id="dpHeader" title="Minimizar / expandir">
        <span class="dp-title">Descargar mapa</span>
        <button id="dpToggle" type="button" class="dp-toggle">−</button>
      </div>
      <div class="dp-body">
        <label for="zoomLevel">Hasta el zoom</label>
        <select id="zoomLevel">
          <option value="13">13 - calles y barrios</option>
          <option value="14">14 - calles principales</option>
          <option value="15">15 - calles detalladas</option>
          <option value="16">16 - detalle completo</option>
          <option value="17">17 - detalle fino (pesado)</option>
        </select>
        <small id="zoomInfo"></small>
      </div>
    </div>
    <div class="pins-panel" id="pinsPanel">
      <div class="dp-header" id="pinsHeader" title="Minimizar / expandir">
        <span class="dp-title">Mis ubicaciones</span>
        <button id="pinsToggle" type="button" class="dp-toggle">−</button>
      </div>
      <div class="pins-body">
        <div class="pins-form">
          <input type="text" id="pinName" placeholder="Nombre del lugar" maxlength="40" />
          <select id="pinColor">
            <option value="#e63946">Rojo</option>
            <option value="#457b9d">Azul</option>
            <option value="#2a9d8f">Verde</option>
            <option value="#e9c46a">Amarillo</option>
            <option value="#9b5de5">Morado</option>
          </select>
          <button id="pinAddBtn" type="button">+ Añadir pin en el mapa</button>
          <small class="hint" id="pinHint"></small>
        </div>
        <div class="pins-list-header" id="pinsListHeader" title="Recoger / desplegar lista">
          <span class="pins-list-title">Lista de pines <span class="pins-count" id="pinsCount"></span></span>
          <button id="pinsListToggle" type="button" class="dp-toggle">−</button>
        </div>
        <ul id="pinList"></ul>
      </div>
    </div>
    <div class="routing-panel" id="routingPanel">
      <div class="dp-header" id="routingHeader" title="Minimizar / expandir">
        <span class="dp-title">Trazar ruta</span>
        <button id="routingToggle" type="button" class="dp-toggle">−</button>
      </div>
      <div class="routing-body">
        <div class="routing-row">
          <span>Origen</span>
          <button id="routeOriginBtn" type="button" class="routing-btn">Seleccionar</button>
          <button id="routeOriginClear" type="button" class="routing-btn" title="Quitar origen">✕</button>
        </div>
        <div class="routing-row">
          <span>Destino</span>
          <button id="routeDestBtn" type="button" class="routing-btn">Seleccionar</button>
          <button id="routeDestClear" type="button" class="routing-btn" title="Quitar destino">✕</button>
        </div>
        <div class="routing-row">
          <span>Modo</span>
          <button id="routeModeCar" type="button" class="routing-btn active">Vehículo</button>
          <button id="routeModeFoot" type="button" class="routing-btn">A pie</button>
        </div>
        <button id="routeGoBtn" type="button" class="routing-primary">Trazar ruta</button>
        <button id="routeClearBtn" type="button" style="margin-top:4px">Limpiar ruta</button>
        <small class="hint" id="routeInfo">Elige origen y destino en el mapa.</small>
        <div id="routeLegend" hidden></div>
        <div class="routing-sep"></div>
        <div class="tsp-title">Ruta por todos los pines <span id="tspPinsCount"></span></div>
        <div id="tspPinsList"></div>
        <div class="routing-row">
          <span>Tipo</span>
          <select id="tspType">
            <option value="open">Abierta</option>
            <option value="closed">Cerrada (circuito)</option>
          </select>
        </div>
        <div class="routing-row">
          <span>Inicio</span>
          <select id="tspStart"><option value="auto">Automático</option></select>
        </div>
        <div class="routing-row">
          <span>Fin</span>
          <select id="tspEnd"><option value="auto">Automático</option></select>
        </div>
        <button id="tspGoBtn" type="button" class="routing-primary">Ruta por todos los pines</button>
        <button id="tspClearBtn" type="button" style="margin-top:4px">Limpiar ruta de pines</button>
        <small class="hint" id="tspInfo">Usa el modo Vehículo o A pie de arriba.</small>
      </div>
    </div>
  </div>
  <div id="offline-status" class="offline-status" hidden></div>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="offline.js"></script>
  <script>
    'use strict';

    var HAVANA_BOUNDS = L.latLngBounds([22.9337108, -82.6072626], [23.3857728, -82.0814213]);
    var MIN_ZOOM = 12;
    var MAX_DOWNLOAD_ZOOM = 17;

    function readStoredZoom() {
      try {
        var v = parseInt(localStorage.getItem('havanamap-maxzoom'), 10);
        return (v >= MIN_ZOOM && v <= MAX_DOWNLOAD_ZOOM) ? v : null;
      } catch (e) {
        return null;
      }
    }

    var downloadTargetZoom = readStoredZoom() || 16;
    var downloadSession = { active: false };

    function downloadZooms() {
      var zs = [];
      for (var z = MIN_ZOOM; z <= downloadTargetZoom; z += 1) zs.push(z);
      return zs;
    }

    var map = L.map('map', {
      center: HAVANA_BOUNDS.getCenter(),
      zoom: MIN_ZOOM,
      minZoom: MIN_ZOOM,
      maxZoom: downloadTargetZoom,
      maxBounds: HAVANA_BOUNDS,
      maxBoundsViscosity: 1,
      zoomControl: false
    });

    new OfflineTileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
      maxZoom: MAX_DOWNLOAD_ZOOM
    }).addTo(map);
    map.attributionControl.setPrefix(false);

    var statusEl = document.getElementById('offline-status');

    function setStatus(text, cls, pct) {
      statusEl.hidden = false;
      statusEl.classList.remove('ready', 'downloading', 'empty');
      if (cls) statusEl.classList.add(cls);
      var bar = '';
      if (pct !== undefined && pct !== null) {
        bar = '<span class="progress"><span class="progress-bar" style="width:' + pct + '%"></span></span>';
      }
      statusEl.innerHTML = '<span class="dot"></span><span class="status-text">' + text + '</span>' + bar;
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      var units = ['B', 'KB', 'MB', 'GB'];
      var i = Math.floor(Math.log(bytes) / Math.log(1024));
      if (i >= units.length) i = units.length - 1;
      return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }

    function refreshStatus() {
      HavanaTiles.getCacheInfo().then(function (info) {
        if (info.count > 0) {
          setStatus('Mapa disponible sin conexión: ' + info.count + ' tiles (' + formatBytes(info.bytes) + ')', 'ready');
        } else {
          setStatus('Mapa sin descargar: se descargará al cargar, requiere internet', 'empty');
        }
      }).catch(function () {
        setStatus('Almacenamiento no disponible', 'empty');
      });
    }

    function tilesForRect(zoom) {
      var topLeft = map.project(HAVANA_BOUNDS.getNorthWest(), zoom).divideBy(256).floor();
      var bottomRight = map.project(HAVANA_BOUNDS.getSouthEast(), zoom).divideBy(256).floor();
      var tiles = [];
      for (var x = topLeft.x; x <= bottomRight.x; x += 1) {
        for (var y = topLeft.y; y <= bottomRight.y; y += 1) {
          tiles.push({
            key: zoom + '/' + x + '/' + y,
            url: 'https://a.tile.openstreetmap.org/' + zoom + '/' + x + '/' + y + '.png'
          });
        }
      }
      return tiles;
    }

    function allTiles() {
      var tiles = [];
      downloadZooms().forEach(function (z) {
        tiles = tiles.concat(tilesForRect(z));
      });
      return tiles;
    }

    function totalTilesFor(maxZoomLevel) {
      var n = 0;
      for (var z = MIN_ZOOM; z <= maxZoomLevel; z += 1) {
        n += tilesForRect(z).length;
      }
      return n;
    }

    function downloadWithLimit(db, tiles, session, onProgress) {
      var MAX_CONCURRENT = 8;
      var index = 0;
      var processed = 0;
      var total = tiles.length;

      function report() {
        if (session.active && onProgress) onProgress(processed, total);
      }

      function processOne(t) {
        if (!session.active) return Promise.resolve();
        return HavanaTiles.getTile(db, t.key)
          .then(function () { processed += 1; report(); })
          .catch(function () {
            if (!session.active) return Promise.resolve();
            var controller = window.AbortController ? new AbortController() : null;
            var timer = controller === null ? null : setTimeout(function () { controller.abort(); }, 20000);
            var opts = { credentials: 'omit' };
            if (controller) opts.signal = controller.signal;
            function clearTimer() { if (timer) clearTimeout(timer); }
            return fetch(t.url, opts)
              .then(function (res) {
                clearTimer();
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.blob();
              })
              .then(function (blob) {
                return new Promise(function (resolveTx, rejectTx) {
                  var tx = db.transaction(HavanaTiles.STORE, 'readwrite');
                  tx.objectStore(HavanaTiles.STORE).put(blob, t.key);
                  tx.oncomplete = function () { resolveTx(); };
                  tx.onerror = function () { rejectTx(tx.error); };
                  tx.onabort = function () { rejectTx(tx.error); };
                });
              })
              .catch(function () {})
              .then(function () { processed += 1; report(); });
          });
      }

      function worker() {
        function run() {
          if (!session.active || index >= total) return Promise.resolve();
          var t = tiles[index];
          index += 1;
          return processOne(t).then(run);
        }
        return run();
      }

      var workers = [];
      for (var w = 0; w < Math.min(MAX_CONCURRENT, total); w += 1) {
        workers.push(worker());
      }
      return Promise.all(workers);
    }

    var downloadRunning = false;

    function ensureOffline() {
      if (downloadRunning) return;
      downloadRunning = true;
      var session = { active: true };
      downloadSession = session;

      var tiles;
      try {
        tiles = allTiles();
      } catch (e) {
        console.error('Error al preparar la descarga:', e);
        refreshStatus();
        return;
      }
      var total = tiles.length;

      HavanaTiles.getCacheInfo().then(function (info) {
        if (!session.active) return;
        if (info.count >= total) { markComplete(); return; }
        var baseMsg = info.count > 0
          ? 'Completando descarga de La Habana...'
          : 'Descargando todo el mapa de La Habana...';
        setStatus(baseMsg + ' (0/' + total + ')', 'downloading', 0);
        return HavanaTiles.openDB().then(function (db) {
          return downloadWithLimit(db, tiles, session, function (done, t) {
            var pct = done === 0 ? 0 : Math.floor(done * 100 / t);
            setStatus('Descargando el mapa de La Habana... ' + pct + '% (' + done + '/' + t + ')', 'downloading', pct);
          });
        });
      }).then(function () {
        if (session.active) markComplete();
      }, function (err) {
        console.error('Error en la descarga offline:', err);
        if (session.active) refreshStatus();
      });
    }

    var zoomSelect = document.getElementById('zoomLevel');
    var zoomInfoEl = document.getElementById('zoomInfo');

    var downloadPanel = document.getElementById('downloadPanel');
    var dpToggle = document.getElementById('dpToggle');

    function collapsePanel() {
      downloadPanel.classList.add('collapsed');
      dpToggle.textContent = '+';
    }

    function expandPanel() {
      downloadPanel.classList.remove('collapsed');
      dpToggle.textContent = '−';
    }

    function isFullyDownloaded() {
      return HavanaTiles.getCacheInfo().then(function (info) {
        return info.count >= totalTilesFor(downloadTargetZoom);
      }).catch(function () { return false; });
    }

    function markComplete() {
      refreshStatus();
      isFullyDownloaded().then(function (full) { if (full) collapsePanel(); });
    }

    dpToggle.addEventListener('click', function (e) {
      e.stopPropagation();
      if (downloadPanel.classList.contains('collapsed')) expandPanel();
      else collapsePanel();
    });
    document.getElementById('dpHeader').addEventListener('click', function () {
      if (downloadPanel.classList.contains('collapsed')) expandPanel();
      else collapsePanel();
    });

    function applyZoomChoice() {
      var v = parseInt(zoomSelect.value, 10);
      if (!(v >= MIN_ZOOM && v <= MAX_DOWNLOAD_ZOOM)) return;
      downloadTargetZoom = v;
      try { localStorage.setItem('havanamap-maxzoom', String(v)); } catch (e) {}
      map.setMaxZoom(v);
      zoomInfoEl.textContent = '≈ ' + totalTilesFor(v).toLocaleString() + ' tiles';
      expandPanel();
      downloadSession.active = false;
      downloadRunning = false;
      ensureOffline();
    }

    zoomSelect.addEventListener('change', applyZoomChoice);
    zoomSelect.value = String(downloadTargetZoom);
    zoomInfoEl.textContent = '≈ ' + totalTilesFor(downloadTargetZoom).toLocaleString() + ' tiles';

    setTimeout(function () {
      map.invalidateSize();
      map.fitBounds(HAVANA_BOUNDS, { padding: [10, 10] });
    }, 100);

    // Iniciar la descarga completa en cuanto se entra a la página,
    // sin depender del evento 'load' del mapa.
    setTimeout(ensureOffline, 500);

    // Si el mapa ya está completo, minimizar el panel de descarga.
    isFullyDownloaded().then(function (full) { if (full) collapsePanel(); });

    // Registrar el Service Worker para poder abrir la página sin conexión
    // (si ya se ha visitado una vez con internet).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.error('Error al registrar el service worker:', err);
        });
      });
    }

    /* ===== Ubicaciones guardadas (pines) ===== */
    var PIN_KEY = 'havanamap-pins';
    var pins = loadPins();
    var pinMode = false;
    var editingPinId = null;
    var pinLayer = L.layerGroup().addTo(map);
    var pinNameInput = document.getElementById('pinName');
    var pinColorInput = document.getElementById('pinColor');
    var pinAddBtn = document.getElementById('pinAddBtn');
    var pinHint = document.getElementById('pinHint');
    var pinListEl = document.getElementById('pinList');

    function loadPins() {
      try {
        var raw = localStorage.getItem(PIN_KEY);
        var arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function savePins() {
      try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch (e) {}
    }

    function findPin(id) {
      for (var i = 0; i < pins.length; i += 1) {
        if (String(pins[i].id) === String(id)) return pins[i];
      }
      return null;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function resetPinForm() {
      editingPinId = null;
      pinMode = false;
      pinNameInput.value = '';
      pinColorInput.value = '#e63946';
      pinAddBtn.classList.remove('active');
      pinAddBtn.textContent = '+ Añadir pin en el mapa';
      map.getContainer().style.cursor = '';
      pinHint.textContent = '';
    }

    function makePinsDot(color) {
      var d = document.createElement('span');
      d.className = 'pin-dot';
      d.style.background = color;
      return d;
    }

    function renderPins() {
      pinLayer.clearLayers();
      pinListEl.innerHTML = '';
      pins.forEach(function (p) {
        var marker = L.circleMarker([p.lat, p.lng], {
          radius: 10,

    pinAddBtn.addEventListener('click', function () {

          };

          };

      });

    pinListEl.addEventListener('click', function (e) {

    var pinsPanel = document.getElementById('pinsPanel');
    var pinsToggle = document.getElementById('pinsToggle');

    var pinsListHeader = document.getElementById('pinsListHeader');
    var pinsListToggle = document.getElementById('pinsListToggle');
    var pinsCount = document.getElementById('pinsCount');

    /* ===== Rutas ===== */
    var origin = null;
    var dest = null;
    var originPin = null;
    var destPin = null;
    var pickingMode = null;
    var routeMarkersLayer = L.layerGroup().addTo(map);
    var routeLineLayer = L.featureGroup().addTo(map);
    var routeInfoEl = document.getElementById('routeInfo');
    var routeOriginBtn = document.getElementById('routeOriginBtn');
    var routeDestBtn = document.getElementById('routeDestBtn');
    var routeGoBtn = document.getElementById('routeGoBtn');
    var routeMode = 'car';
    var routeModeLabel = 'Vehículo';

    function setRoutingInfo(msg) {
      if (routeInfoEl) routeInfoEl.textContent = msg;
    }

    function deactivateRoutingPicking() {
      pickingMode = null;
      routeOriginBtn.classList.remove('active');
      routeDestBtn.classList.remove('active');
      map.getContainer().style.cursor = '';
    }

    function selectPickedPin(p) {
      if (pickingMode === 'origin') {
        origin = { lat: p.lat, lng: p.lng };
        originPin = p;
        deactivateRoutingPicking();
        setRoutingInfo('Origen: "' + p.name + '". Ahora elige el destino.');
      } else if (pickingMode === 'dest') {
        dest = { lat: p.lat, lng: p.lng };
        destPin = p;
        deactivateRoutingPicking();
        setRoutingInfo('Destino: "' + p.name + '". Pulsa "Trazar ruta".');
      } else {
        return;
      }
      renderRouteMarkers();
      updateRouteButtons();
    }

    function pinAtClick(e) {
      var clickPt = map.latLngToContainerPoint(e.latlng);
      var threshold = 25;
      for (var i = 0; i < pins.length; i += 1) {
        var pinPt = map.latLngToContainerPoint([pins[i].lat, pins[i].lng]);
        if (clickPt.distanceTo(pinPt) <= threshold) return pins[i];
      }
      return null;
    }

    function makeRouteMarker(p, color, label) {
      return L.circleMarker([p.lat, p.lng], {
        radius: 12,
        color: '#fff',
        weight: 2,
        fillColor: color,
        fillOpacity: 1
      }).bindTooltip(label, { permanent: true, direction: 'top', offset: [0, -10], opacity: 0.9 })
        .addTo(routeMarkersLayer);
    }

    function renderRouteMarkers() {
      routeMarkersLayer.clearLayers();
      if (origin) makeRouteMarker(origin, '#4caf50', 'Origen');
      if (dest) makeRouteMarker(dest, '#e63946', 'Destino');
    }

    function updateRouteButtons() {
      routeGoBtn.disabled = !(origin && dest);
    }

    function clearRoute() {
      origin = null;
      dest = null;
      originPin = null;
      destPin = null;
      deactivateRoutingPicking();
      routeMarkersLayer.clearLayers();
      routeLineLayer.clearLayers();
      clearPassLegend();
      updateRouteButtons();
      setRoutingInfo('Elige origen y destino en el mapa.');
    }

    function pointLabel(pin, pos) {
      if (pin && pin.name) return '"' + pin.name + '"';
      return pos.lat.toFixed(4) + ', ' + pos.lng.toFixed(4);
    }

    function formatDistance(meters) {
      return meters >= 1000
        ? (meters / 1000).toFixed(1) + ' km'
        : Math.round(meters) + ' m';
    }

    /* ===== Dibujo de la ruta: tramos repetidos en carriles paralelos ===== */
    var PASS_COLORS = ['#e91e63', '#8e24aa', '#00897b', '#6d4c41', '#c0ca33'];

    function dedupeCoords(coords) {
      var out = [];
      for (var i = 0; i < coords.length; i++) {
        var p = coords[i];
        if (!out.length) { out.push([p[0], p[1]]); continue; }
        var q = out[out.length - 1];
        if (Math.abs(q[0] - p[0]) > 1e-7 || Math.abs(q[1] - p[1]) > 1e-7) out.push([p[0], p[1]]);
      }
      return out;
    }

    function segKey(a, b) {
      var ka = Math.round(a[0] * 1e6) + ',' + Math.round(a[1] * 1e6);
      var kb = Math.round(b[0] * 1e6) + ',' + Math.round(b[1] * 1e6);
      return ka < kb ? ka + '|' + kb : kb + '|' + ka;
    }

    function segOffset(a, b, meters) {
      var cosLat = Math.cos(((a[0] + b[0]) / 2) * Math.PI / 180);
      var ka = Math.round(a[0] * 1e6) + ',' + Math.round(a[1] * 1e6);
      var kb = Math.round(b[0] * 1e6) + ',' + Math.round(b[1] * 1e6);
      var sign = ka < kb ? 1 : -1;
      var dLatM = (b[0] - a[0]) * 110540;
      var dLngM = (b[1] - a[1]) * 111320 * cosLat;
      var len = Math.sqrt(dLatM * dLatM + dLngM * dLngM);
      if (!len) return { lat: 0, lng: 0 };
      var nx = -dLatM / len * sign;
      var ny = dLngM / len * sign;
      return {
        lat: ny * meters / 110540,
        lng: nx * meters / (111320 * cosLat)
      };
    }

    function buildRouteLanes(coords, stepM) {
      var n = coords.length;
      if (n < 2) return [];
      var i, k;
      var keys = [];
      var counts = {};
      for (i = 0; i < n - 1; i++) {
        k = segKey(coords[i], coords[i + 1]);
        keys.push(k);
        counts[k] = (counts[k] || 0) + 1;
      }
      var seen = {};
      var lanes = [], totals = [], offs = [];
      for (i = 0; i < n - 1; i++) {
        var lane = seen[keys[i]] || 0;
        seen[keys[i]] = lane + 1;
        lanes.push(lane);
        totals.push(counts[keys[i]]);
        offs.push(lane === 0
          ? { lat: 0, lng: 0 }
          : segOffset(coords[i], coords[i + 1], Math.min(lane, PASS_COLORS.length) * stepM));
      }
      var runs = [];
      i = 0;
      while (i < n - 1) {
        var j = i;
        while (j + 1 < n - 1 && lanes[j + 1] === lanes[i] && totals[j + 1] === totals[i]) j += 1;
        var run = { lane: lanes[i], total: totals[i], pts: [] };
        if (lanes[i] > 0) run.pts.push([coords[i][0], coords[i][1]]);
        for (var s = i; s <= j; s++) {
          var oa = offs[s];
          if (s > i) {
            oa = {
              lat: (offs[s].lat + offs[s - 1].lat) / 2,
              lng: (offs[s].lng + offs[s - 1].lng) / 2
            };
          }
          run.pts.push([coords[s][0] + oa.lat, coords[s][1] + oa.lng]);
        }
        run.pts.push([coords[j + 1][0] + offs[j].lat, coords[j + 1][1] + offs[j].lng]);
        if (lanes[i] > 0) run.pts.push([coords[j + 1][0], coords[j + 1][1]]);
        runs.push(run);
        i = j + 1;
      }
      return runs;
    }

    function passStyle(baseColor, lane) {
      if (lane === 0) return { color: baseColor, weight: 6, opacity: 0.8 };
      return {
        color: PASS_COLORS[(lane - 1) % PASS_COLORS.length],
        weight: 5,
        opacity: 0.95,
        dashArray: '12 7'
      };
    }

    function updatePassLegend(runs) {
      var el = document.getElementById('routeLegend');
      if (!el) return;
      var lanes = {};
      for (var i = 0; i < runs.length; i++) {
        if (runs[i].lane > 0) lanes[runs[i].lane] = true;
      }
      var keys = Object.keys(lanes).map(Number).sort(function (a, b) { return a - b; });
      if (!keys.length) {
        el.hidden = true;
        el.innerHTML = '';
        return;
      }
      var html = '<span>Tramos repetidos: </span>';
      keys.forEach(function (ln) {
        html += '<span class="legend-item"><i style="border-top-color:' +
          PASS_COLORS[(ln - 1) % PASS_COLORS.length] + ';border-top-style:dashed"></i>' +
          (ln + 1) + 'ª pasada</span>';
      });
      el.hidden = false;
      el.innerHTML = html;
    }

    function clearPassLegend() {
      var el = document.getElementById('routeLegend');
      if (!el) return;
      el.hidden = true;
      el.innerHTML = '';
    }

    function renderRoutePolyline(coords, baseColor) {
      routeLineLayer.clearLayers();
      var clean = dedupeCoords(coords);
      var step = routeMode === 'car' ? 18 : 11;
      var runs = buildRouteLanes(clean, step);
      runs.forEach(function (r) {
        var st = passStyle(baseColor, r.lane);
        routeLineLayer.addLayer(L.polyline(r.pts, st));
      });
      updatePassLegend(runs);
      return runs;
    }

    function drawRoute(route) {
      renderRoutePolyline(route.geometry.coordinates.map(function (c) { return [c[1], c[0]]; }), '#2196f3');
      renderRouteMarkers();
      map.fitBounds(routeLineLayer.getBounds(), { padding: [30, 30] });
      setRoutingInfo('Ruta (' + routeModeLabel + ') de ' + pointLabel(originPin, origin) + ' a ' +
        pointLabel(destPin, dest) + '. Distancia: ' + formatDistance(route.distance));
    }

    function decodePolyline6(str) {
      var pts = [], index = 0, lat = 0, lng = 0;
      while (index < str.length) {
        var b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 32);
        var dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
        lat += dlat;
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 32);
        var dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
        lng += dlng;
        pts.push([lat / 1e6, lng / 1e6]);
      }
      return pts;
    }

    function extractOsrmRoute(json) {
      if (json && json.code === 'Ok' && json.routes && json.routes.length) return json.routes[0];
      return null;
    }

    function extractValhallaRoute(json) {
      var leg = json && json.trip && json.trip.legs && json.trip.legs[0];
      if (!leg || !leg.shape || !leg.summary) return null;
      var coords = decodePolyline6(leg.shape);
      if (!coords.length) return null;
      return {
        distance: leg.summary.length * 1000,
        geometry: { type: 'LineString', coordinates: coords.map(function (p) { return [p[1], p[0]]; }) }
      };
    }

    function haversineKm(a, b) {
      var R = 6371;
      var dLat = (b.lat - a.lat) * Math.PI / 180;
      var dLng = (b.lng - a.lng) * Math.PI / 180;
      var la1 = a.lat * Math.PI / 180;
      var la2 = b.lat * Math.PI / 180;
      var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(la1) * Math.cos(la2) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function drawOfflineFallback(reason) {
      routeLineLayer.clearLayers();
      clearPassLegend();
      routeLineLayer.addLayer(L.polyline(
        [[origin.lat, origin.lng], [dest.lat, dest.lng]],
        { color: '#757575', weight: 4, opacity: 0.8, dashArray: '6 8' }
      ));
      renderRouteMarkers();
      map.fitBounds(routeLineLayer.getBounds(), { padding: [30, 30] });
      var km = haversineKm(origin, dest);
      var dist = km >= 1 ? km.toFixed(1) + ' km' : Math.round(km * 1000) + ' m';
      setRoutingInfo((reason ? reason + ' ' : '') +
        'Sin conexión al servicio de rutas. Distancia en línea recta: ' + dist + '.');
    }

    // ===== Motor de rutas local (grafo de calles OSM + Dijkstra, sin conexión) =====
    var LOCAL_GRAPH = null;
    var LOCAL_ADJ = { car: null, foot: null };

    function loadLocalGraph() {
      if (LOCAL_GRAPH) return Promise.resolve(LOCAL_GRAPH);
      return fetch('data/havana-graph.json').then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function (g) {
        LOCAL_GRAPH = g;
        return g;
      });
    }

    function nearestLocalNode(g, p, adj) {
      var lats = g.nodes.lat, lons = g.nodes.lon;
      var best = -1, bd = Infinity;
      for (var i = 0; i < lats.length; i++) {
        if (adj && adj[i] && !adj[i].length) continue;
        var d = (lats[i] - p.lat) * (lats[i] - p.lat) + (lons[i] - p.lng) * (lons[i] - p.lng);
        if (d < bd) { bd = d; best = i; }
      }
      return best;
    }

    function dijkstraLocal(adj, s, t) {
      var N = adj.length;
      var dist = new Float64Array(N);
      var prev = new Int32Array(N);
      var done = new Uint8Array(N);
      var heap = [[0, s]];
      for (var i = 0; i < N; i++) dist[i] = Infinity;
      for (var i = 0; i < N; i++) prev[i] = -1;
      dist[s] = 0;
      function push(item) {
        var h = heap.length;
        heap.push(item);
        while (h > 0) {
          var p = (h - 1) >> 1;
          if (heap[p][0] <= heap[h][0]) break;
          var tmp = heap[p]; heap[p] = heap[h]; heap[h] = tmp;
          h = p;
        }
      }
      function pop() {
        var top = heap[0];
        var last = heap.pop();
        if (heap.length) {
          heap[0] = last;
          var h = 0;
          for (;;) {
            var l = h * 2 + 1, r = l + 1, m = h;
            if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
            if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
            if (m === h) break;
            var tmp = heap[m]; heap[m] = heap[h]; heap[h] = tmp;
            h = m;
          }
        }
        return top;
      }
      while (heap.length) {
        var cur = pop();
        var u = cur[1];
        if (done[u]) continue;
        done[u] = 1;
        if (u === t) break;
        var al = adj[u];
        for (var k = 0; k < al.length; k++) {
          var v = al[k][0], w = al[k][1], nd = dist[u] + w;
          if (nd < dist[v]) { dist[v] = nd; prev[v] = u; push([nd, v]); }
        }
      }
      if (dist[t] === Infinity) return null;
      var path = [];
      for (var x = t; x !== -1; x = prev[x]) path.push(x);
      path.reverse();
      return { distM: dist[t], path: path };
    }

    function getAdjLocal(g, profile) {
      var adj = LOCAL_ADJ[profile];
      if (adj) return adj;
      var edges = g.edges[profile];
      adj = new Array(g.nodes.lat.length);
      for (var i = 0; i < adj.length; i++) adj[i] = [];
      for (var e = 0; e < edges.length; e++) {
        var ed = edges[e];
        adj[ed[0]].push([ed[1], ed[2]]);
        if (profile === 'car') adj[ed[1]].push([ed[0], ed[2]]);
      }
      LOCAL_ADJ[profile] = adj;
      return adj;
    }

    function localRouteOn(g, a, b, profile) {
      var adj = getAdjLocal(g, profile);
      var s = nearestLocalNode(g, a, adj);
      var t = nearestLocalNode(g, b, adj);
      if (s === -1 || t === -1 || s === t) return null;
      var snapA = haversineKm(a, { lat: g.nodes.lat[s], lng: g.nodes.lon[s] }) * 1000;
      var snapB = haversineKm(b, { lat: g.nodes.lat[t], lng: g.nodes.lon[t] }) * 1000;
      if (snapA > 3000 || snapB > 3000) return null;
      var res = dijkstraLocal(adj, s, t);
      if (!res) return null;
      var lats = g.nodes.lat, lons = g.nodes.lon;
      var coords = res.path.map(function (idx) { return [lats[idx], lons[idx]]; });
      return { distance: res.distM, coords: coords };
    }

    function computeLocalRoute(a, b, profile) {
      var g = LOCAL_GRAPH;
      if (!g) return null;
      var res = localRouteOn(g, a, b, profile);
      if (res) return res;
      if (profile === 'car') {
        var alt = localRouteOn(g, a, b, 'foot');
        if (alt) { alt.fallbackProfile = 'foot'; return alt; }
      }
      return null;
    }

    function drawLocalRoute(reason) {
      var r = computeLocalRoute(origin, dest, routeMode);
      if (!r) {
        drawOfflineFallback(reason || '');
        return;
      }
      routeLineLayer.clearLayers();
      renderRoutePolyline(r.coords, '#2196f3');
      renderRouteMarkers();
      map.fitBounds(routeLineLayer.getBounds(), { padding: [30, 30] });
      var via = r.fallbackProfile ? ' (callejones/vías no aptas: se usó la red ampliada)' : '';
      setRoutingInfo((reason ? reason + ' ' : '') + 'Ruta por calles (cálculo local sin conexión a servicios). Distancia: ' +
        formatDistance(r.distance) + '.' + via);
    }

    function traceRoute() {
      if (!origin || !dest) return;
      routeGoBtn.disabled = true;
      if (navigator.onLine === false) {
        setRoutingInfo('Sin conexión: calculando ruta en el grafo local...');
        loadLocalGraph().then(function () {
          drawLocalRoute('Estás sin conexión.');
        }).catch(function () {
          drawOfflineFallback('Estás sin conexión.');
        }).then(function () {
          routeGoBtn.disabled = !(origin && dest);
        });
        return;
      }
      setRoutingInfo('Calculando ruta...');
      loadLocalGraph(); // prefetch: grafo listo por si fallan los servicios
      var coords = origin.lng + ',' + origin.lat + ';' + dest.lng + ',' + dest.lat;
      var costings = { car: 'auto', foot: 'pedestrian' };
      var osrmServers = routeMode === 'car'
        ? [
          'https://routing.openstreetmap.de/routed-car/route/v1/driving/',
          'https://router.project-osrm.org/route/v1/driving/'
        ]
        : [
          'https://routing.openstreetmap.de/routed-foot/route/v1/walking/',
          'https://router.project-osrm.org/route/v1/foot/'
        ];
      var requests = osrmServers.map(function (s) {
        return { kind: 'osrm', url: s + coords + '?overview=full&geometries=geojson' };
      });
      requests.push({
        kind: 'valhalla',
        url: 'https://valhalla1.openstreetmap.de/route?json=' + encodeURIComponent(JSON.stringify({
          locations: [
            { lat: origin.lat, lon: origin.lng },
            { lat: dest.lat, lon: dest.lng }
          ],
          costing: costings[routeMode],
          units: 'kilometers'
        }))
      });
      function fetchWithTimeout(url, ms) {
        return new Promise(function (resolve, reject) {
          var done = false;
          var timer = setTimeout(function () {
            done = true;
            reject(new Error('timeout'));
          }, ms);
          var controller = window.AbortController ? new AbortController() : null;
          var opts = {};
          if (controller) opts.signal = controller.signal;
          fetch(url, opts).then(function (res) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            resolve(res);
          }, function (err) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            reject(err);
          });
        });
      }
      var settled = false;
      var pending = requests.length;
      function finish(okFn) {
        if (settled) return;
        settled = true;
        okFn();
      }
      function fallbackLocal(reason) {
        if (settled) return;
        settled = true;
        setRoutingInfo('Servicios de ruta no disponibles. Calculando en el grafo local...');
        loadLocalGraph().then(function () {
          drawLocalRoute(reason);
        }).catch(function () {
          drawOfflineFallback(reason);
        }).then(function () {
          routeGoBtn.disabled = !(origin && dest);
        });
      }
      setTimeout(function () {
        fallbackLocal('No respondió ningún servicio de rutas.');
      }, 25000);
      requests.forEach(function (req) {
        fetchWithTimeout(req.url, 12000).then(function (res) {
          if (settled) return;
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }).then(function (json) {
          if (settled) return;
          var route = req.kind === 'valhalla' ? extractValhallaRoute(json) : extractOsrmRoute(json);
          if (!route) throw new Error('sin ruta');
          finish(function () {
            drawRoute(route);
            routeGoBtn.disabled = !(origin && dest);
          });
        }).catch(function () {
          pending--;
          if (pending === 0 && !settled) {
            fallbackLocal('No respondió ningún servicio de rutas.');
          }
        });
      });
    }

    /* ===== Ruta que pasa por todos los pines (TSP) ===== */
    var tspSelected = {};
    var tspTypeEl = document.getElementById('tspType');
    var tspStartEl = document.getElementById('tspStart');
    var tspEndEl = document.getElementById('tspEnd');
    var tspPinsListEl = document.getElementById('tspPinsList');
    var tspPinsCountEl = document.getElementById('tspPinsCount');
    var tspGoBtn = document.getElementById('tspGoBtn');
    var tspInfoEl = document.getElementById('tspInfo');

    function setTspInfo(msg) {
      if (tspInfoEl) tspInfoEl.textContent = msg;
    }

    function tspChosenPins() {
      return pins.filter(function (p) { return tspSelected[p.id] !== false; });
    }

    function tspOptionExists(sel, value) {
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === value) return true;
      }
      return false;
    }

    function tspFillSelect(sel, chosen, prev) {
      sel.innerHTML = '';
      var auto = document.createElement('option');
      auto.value = 'auto';
      auto.textContent = 'Automático';
      sel.appendChild(auto);
      chosen.forEach(function (p) {
        var o = document.createElement('option');
        o.value = p.id;
        o.textContent = p.name;
        sel.appendChild(o);
      });
      sel.value = tspOptionExists(sel, prev) ? prev : 'auto';
    }

    function updateTspPanel() {
      if (!tspPinsListEl) return;
      var chosen = tspChosenPins();
      tspPinsListEl.innerHTML = '';
      pins.forEach(function (p) {
        var label = document.createElement('label');
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = tspSelected[p.id] !== false;
        cb.addEventListener('change', function () {
          tspSelected[p.id] = cb.checked;
          updateTspPanel();
        });
        var name = document.createElement('span');
        name.textContent = p.name;
        label.appendChild(cb);
        label.appendChild(makePinsDot(p.color));
        label.appendChild(name);
        tspPinsListEl.appendChild(label);
      });

      if (tspPinsCountEl) tspPinsCountEl.textContent = pins.length ? '(' + chosen.length + '/' + pins.length + ')' : '';

      var prevStart = tspStartEl.value;
      var prevEnd = tspEndEl.value;
      tspFillSelect(tspStartEl, chosen, prevStart);
      tspFillSelect(tspEndEl, chosen, prevEnd);

      var closed = tspTypeEl && tspTypeEl.value === 'closed';
      tspStartEl.disabled = closed;
      tspEndEl.disabled = closed;
      if (tspGoBtn) tspGoBtn.disabled = chosen.length < 2;
      if (chosen.length < 2) setTspInfo('Marca al menos 2 pines.');
      else setTspInfo('Modo: ' + routeModeLabel + '. Elige inicio/fin o déjalos en automático.');
    }

    function tspIndexOfPin(chosen, id) {
      if (!id || id === 'auto') return -1;
      for (var i = 0; i < chosen.length; i++) {
        if (chosen[i].id === id) return i;
      }
      return -1;
    }

    function tspSnapPoints(g, adj, points) {
      var lats = g.nodes.lat, lons = g.nodes.lon;
      var out = [];
      for (var i = 0; i < points.length; i++) {
        var idx = nearestLocalNode(g, points[i], adj);
        if (idx < 0) return null;
        out.push({
          idx: idx,
          snapM: haversineKm(points[i], { lat: lats[idx], lng: lons[idx] }) * 1000
        });
      }
      return out;
    }

    function tspMatrix(g, adj, nodes) {
      var n = nodes.length;
      var dist = [];
      var paths = [];
      for (var i = 0; i < n; i++) {
        dist.push(new Float64Array(n));
        paths.push(new Array(n));
        for (var j = 0; j < n; j++) {
          if (i === j) { dist[i][j] = 0; paths[i][j] = [nodes[i].idx]; continue; }
          var r = dijkstraLocal(adj, nodes[i].idx, nodes[j].idx);
          if (!r) return null;
          dist[i][j] = r.distM;
          paths[i][j] = r.path;
        }
      }
      return { dist: dist, paths: paths };
    }

    function tspExact(dist, n, start, end) {
      var active = [], i;
      for (i = 0; i < n; i++) { if (i !== end) active.push(i); }
      var m = active.length;
      if (m === 0) return { order: [end], cost: 0 };
      var startFree = start < 0 || start === end;
      var startLocal = -1;
      if (!startFree) {
        startLocal = active.indexOf(start);
        if (startLocal < 0) return null;
      }
      var size = 1 << m;
      var dp = new Float64Array(size * m);
      var par = new Int32Array(size * m);
      for (i = 0; i < dp.length; i++) { dp[i] = Infinity; par[i] = -1; }
      if (startFree) {
        for (i = 0; i < m; i++) dp[(1 << i) * m + i] = 0;
      } else {
        dp[(1 << startLocal) * m + startLocal] = 0;
      }
      var full = size - 1;
      for (var mask = 1; mask < size; mask++) {
        for (var j = 0; j < m; j++) {
          if ((mask & (1 << j)) === 0) continue;
          var cur = dp[mask * m + j];
          if (cur === Infinity) continue;
          for (var k = 0; k < m; k++) {
            if (mask & (1 << k)) continue;
            var nm = mask | (1 << k);
            var nd = cur + dist[active[j]][active[k]];
            if (nd < dp[nm * m + k]) {
              dp[nm * m + k] = nd;
              par[nm * m + k] = j;
            }
          }
        }
      }
      var best = Infinity, bestJ = -1;
      for (j = 0; j < m; j++) {
        var cost = dp[full * m + j];
        if (cost === Infinity) continue;
        if (end >= 0) cost += dist[active[j]][end];
        if (cost < best) { best = cost; bestJ = j; }
      }
      if (bestJ < 0) return null;
      var order = [];
      var curMask = full, curJ = bestJ;
      while (curJ >= 0) {
        order.push(active[curJ]);
        var pj = par[curMask * m + curJ];
        curMask ^= (1 << curJ);
        curJ = pj;
      }
      order.reverse();
      if (end >= 0) order.push(end);
      return { order: order, cost: best };
    }

    function tspExactClosed(dist, n, anchor) {
      if (n <= 1) return { order: [anchor, anchor], cost: 0 };
      var size = 1 << n;
      var dp = new Float64Array(size * n);
      var par = new Int32Array(size * n);
      for (var i = 0; i < dp.length; i++) { dp[i] = Infinity; par[i] = -1; }
      dp[(1 << anchor) * n + anchor] = 0;
      var full = size - 1;
      for (var mask = 1; mask < size; mask++) {
        for (var j = 0; j < n; j++) {
          if ((mask & (1 << j)) === 0) continue;
          var cur = dp[mask * n + j];
          if (cur === Infinity) continue;
          for (var k = 0; k < n; k++) {
            if (mask & (1 << k)) continue;
            var nm = mask | (1 << k);
            var nd = cur + dist[j][k];
            if (nd < dp[nm * n + k]) {
              dp[nm * n + k] = nd;
              par[nm * n + k] = j;
            }
          }
        }
      }
      var best = Infinity, bestJ = -1;
      for (j = 0; j < n; j++) {
        if (j === anchor) continue;
        var cost = dp[full * n + j] + dist[j][anchor];
        if (cost < best) { best = cost; bestJ = j; }
      }
      if (bestJ < 0) return null;
      var order = [];
      var curMask = full, curJ = bestJ;
      while (curJ >= 0) {
        order.push(curJ);
        var pj = par[curMask * n + curJ];
        curMask ^= (1 << curJ);
        curJ = pj;
      }
      order.reverse();
      order.push(anchor);
      return { order: order, cost: best };
    }

    function tsp2opt(dist, order) {
      var n = order.length;
      var improved = true, rounds = 0;
      while (improved && rounds < 200) {
        improved = false;
        rounds += 1;
        for (var i = 0; i < n - 2; i++) {
          for (var j = i + 1; j < n - 1; j++) {
            var a = order[i], b = order[i + 1], c = order[j], d = order[j + 1];
            var delta = dist[a][c] + dist[b][d] - dist[a][b] - dist[c][d];
            if (delta < -1e-9) {
              var lo = i + 1, hi = j;
              while (lo < hi) { var t = order[lo]; order[lo] = order[hi]; order[hi] = t; lo++; hi--; }
              improved = true;
            }
          }
        }
      }
    }

    function tspHeuristic(dist, n, start, end, closed) {
      var anchor = closed ? (start >= 0 ? start : 0) : -1;
      var remaining = [];
      for (var i = 0; i < n; i++) {
        if (closed) { if (i !== anchor) remaining.push(i); }
        else if (i !== start && i !== end) remaining.push(i);
      }
      var order = [];
      var cur;
      if (closed) { cur = anchor; order.push(cur); }
      else if (start >= 0) { cur = start; order.push(cur); }
      else if (remaining.length) { cur = remaining.shift(); order.push(cur); }
      else { cur = 0; order.push(cur); }
      while (remaining.length) {
        var bi = 0, bd = Infinity;
        for (var r = 0; r < remaining.length; r++) {
          var d = dist[cur][remaining[r]];
          if (d < bd) { bd = d; bi = r; }
        }
        cur = remaining.splice(bi, 1)[0];
        order.push(cur);
      }
      if (closed) order.push(anchor);
      else if (end >= 0 && end !== start) order.push(end);
      tsp2opt(dist, order);
      return { order: order };
    }

    function tspSolveOrder(dist, n, start, end, closed) {
      if (closed) {
        if (n <= 12) return tspExactClosed(dist, n, start >= 0 ? start : 0);
        return tspHeuristic(dist, n, start, end, true);
      }
      if (n <= 12) return tspExact(dist, n, start, end);
      return tspHeuristic(dist, n, start, end, false);
    }

    function drawTspRoute(sol, mat, chosen, usedProfile, closed) {
      var coords = [];
      var total = 0;
      var order = sol.order;
      for (var q = 1; q < order.length; q++) {
        var a = order[q - 1], b = order[q];
        var seg = mat.paths[a][b];
        var lats = LOCAL_GRAPH.nodes.lat, lons = LOCAL_GRAPH.nodes.lon;
        if (!coords.length) coords.push([chosen[a].lat, chosen[a].lng]);
        for (var k = 0; k < seg.length; k++) coords.push([lats[seg[k]], lons[seg[k]]]);
        coords.push([chosen[b].lat, chosen[b].lng]);
      }
      for (q = 1; q < order.length; q++) total += mat.dist[order[q - 1]][order[q]];
      for (q = 0; q < mat.snap.length; q++) total += mat.snap[q];

      routeLineLayer.clearLayers();
      renderRoutePolyline(coords, '#ff9800');
      map.fitBounds(routeLineLayer.getBounds(), { padding: [30, 30] });
      var extra = usedProfile !== routeMode ? ' (red a pie: algunas vías no son aptas para coche)' : '';
      var approx = chosen.length > 12 ? ' Orden aproximado.' : '';
      setTspInfo('Ruta por ' + chosen.length + ' pines (' + (closed ? 'cerrada' : 'abierta') + ', ' +
        (usedProfile === 'car' ? 'Vehículo' : 'A pie') + '). Distancia total: ' +
        formatDistance(total) + '.' + extra + approx);
    }

    function tspRun() {
      var chosen = tspChosenPins();
      if (chosen.length < 2) { setTspInfo('Marca al menos 2 pines para trazar la ruta.'); return; }
      tspGoBtn.disabled = true;
      setTspInfo('Calculando ruta por ' + chosen.length + ' pines...');
      var closed = tspTypeEl.value === 'closed';
      var startIdx = tspIndexOfPin(chosen, tspStartEl.value);
      var endIdx = tspIndexOfPin(chosen, tspEndEl.value);
      if (closed) { var anchor = endIdx >= 0 ? endIdx : 0; startIdx = anchor; endIdx = anchor; }

      loadLocalGraph().then(function (g) {
        var usedProfile = routeMode;
        var adj = getAdjLocal(g, usedProfile);
        var nodes = tspSnapPoints(g, adj, chosen);
        var mat = nodes ? tspMatrix(g, adj, nodes) : null;
        if (!mat && usedProfile === 'car') {
          usedProfile = 'foot';
          adj = getAdjLocal(g, 'foot');
          nodes = tspSnapPoints(g, adj, chosen);
          mat = nodes ? tspMatrix(g, adj, nodes) : null;
        }
        if (!mat) {
          setTspInfo('No se pudo conectar por calles todos los pines seleccionados. Prueba el modo A pie.');
          tspGoBtn.disabled = chosen.length < 2;
          return;
        }
        mat.snap = nodes.map(function (nd) { return nd.snapM; });
        var sol = tspSolveOrder(mat.dist, chosen.length, startIdx, endIdx, closed);
        if (!sol) {
          setTspInfo('No se encontró un recorrido válido para esos pines.');
          tspGoBtn.disabled = chosen.length < 2;
          return;
        }
        drawTspRoute(sol, mat, chosen, usedProfile, closed);
        tspGoBtn.disabled = chosen.length < 2;
      }).catch(function () {
        setTspInfo('No se pudo cargar el grafo de calles.');
        tspGoBtn.disabled = chosen.length < 2;
      });
    }

    if (tspTypeEl) {
      tspTypeEl.addEventListener('change', updateTspPanel);
      tspGoBtn.addEventListener('click', tspRun);
      document.getElementById('tspClearBtn').addEventListener('click', function () {
        routeLineLayer.clearLayers();
        clearPassLegend();
        setTspInfo('Ruta de pines borrada.');
      });
    }

    routeOriginBtn.addEventListener('click', function () {
      if (pickingMode === 'origin') {
        deactivateRoutingPicking();
        setRoutingInfo('Selección de origen cancelada.');
        return;
      }
      deactivateRoutingPicking();
      pickingMode = 'origin';
      routeOriginBtn.classList.add('active');
      map.getContainer().style.cursor = 'crosshair';
      setRoutingInfo('Haz clic en el mapa para marcar el origen.');
    });

    routeDestBtn.addEventListener('click', function () {
      if (pickingMode === 'dest') {
        deactivateRoutingPicking();
        setRoutingInfo('Selección de destino cancelada.');
        return;
      }
      deactivateRoutingPicking();
      pickingMode = 'dest';
      routeDestBtn.classList.add('active');
      map.getContainer().style.cursor = 'crosshair';
      setRoutingInfo('Haz clic en el mapa para marcar el destino.');
    });

    document.getElementById('routeOriginClear').addEventListener('click', function () {
      origin = null;
      originPin = null;
      deactivateRoutingPicking();
      renderRouteMarkers();
      updateRouteButtons();
      setRoutingInfo('Origen quitado.');
    });

    document.getElementById('routeDestClear').addEventListener('click', function () {
      dest = null;
      destPin = null;
      deactivateRoutingPicking();
      renderRouteMarkers();
      updateRouteButtons();
      setRoutingInfo('Destino quitado.');
    });

    document.getElementById('routeClearBtn').addEventListener('click', clearRoute);
    routeGoBtn.addEventListener('click', traceRoute);

    document.getElementById('routeModeCar').addEventListener('click', function () {
      if (routeMode === 'car') return;
      routeMode = 'car';
      routeModeLabel = 'Vehículo';
      document.getElementById('routeModeCar').classList.add('active');
      document.getElementById('routeModeFoot').classList.remove('active');
      setRoutingInfo('Modo de ruta: Vehículo.');
    });
    document.getElementById('routeModeFoot').addEventListener('click', function () {
      if (routeMode === 'foot') return;
      routeMode = 'foot';
      routeModeLabel = 'A pie';
      document.getElementById('routeModeFoot').classList.add('active');
      document.getElementById('routeModeCar').classList.remove('active');
      setRoutingInfo('Modo de ruta: A pie.');
    });

    renderRouteMarkers();
    updateRouteButtons();

    var routingPanel = document.getElementById('routingPanel');
    var routingToggle = document.getElementById('routingToggle');

    function collapseRoutingPanel() {
      routingPanel.classList.add('collapsed');
      routingToggle.textContent = '+';
    }

    function expandRoutingPanel() {
      routingPanel.classList.remove('collapsed');
      routingToggle.textContent = '−';
    }

    document.getElementById('routingHeader').addEventListener('click', function () {
      if (routingPanel.classList.contains('collapsed')) expandRoutingPanel();
      else collapseRoutingPanel();
    });

    routingToggle.addEventListener('click', function (e) {
      e.stopPropagation();
      if (routingPanel.classList.contains('collapsed')) expandRoutingPanel();
      else collapseRoutingPanel();
    });

    renderPins();

    refreshStatus();
  </script>
</body>
