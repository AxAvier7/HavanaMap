<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de La Habana, Cuba</title>
  <link rel="stylesheet" href="lib/leaflet/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100vh; background: #ccc; }
    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 220px;
    }
    .download-panel {
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 12px;
      max-width: 220px;
    }
    .download-panel label { display: block; margin-bottom: 4px; }
    .download-panel select { width: 100%; font-size: 12px; }
    .download-panel small { display: block; margin-top: 4px; color: #ccc; }
    .download-panel .dp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }
    .download-panel .dp-title { font-weight: bold; }
    .download-panel .dp-toggle {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      border: none;
      border-radius: 3px;
      width: 20px;
      height: 20px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      flex: none;
    }
    .download-panel.collapsed { padding: 4px 8px; }
    .download-panel.collapsed .dp-body { display: none; }
    .pins-panel {
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 12px;
      max-width: 220px;
    }
    .pins-title { font-weight: bold; display: block; margin-bottom: 6px; }
    .pins-form input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .pins-form select { width: 100%; font-size: 12px; margin-bottom: 4px; }
    .pins-form button {
      width: 100%;
      padding: 5px;
      font-size: 12px;
      cursor: pointer;
    }
    .pins-form button.active { background: #4caf50; color: #fff; border-color: #4caf50; }
    .pins-form .hint { display: block; margin-top: 4px; color: #ccc; }
    #pinList {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      max-height: 180px;
      overflow-y: auto;
    }
    #pinList li {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }
    #pinList .pin-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    #pinList .pin-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pinList button {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
      flex: none;
    }
    .offline-status {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      max-width: 260px;
    }
    .offline-status .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #bbb;
      flex: none;
    }
    .offline-status.ready .dot { background: #4caf50; }
    .offline-status.downloading .dot {
      background: #ff9800;
      animation: offline-pulse 1s infinite;
    }
    .offline-status.empty .dot { background: #f44336; }
    @keyframes offline-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .offline-status .progress {
      flex: 1 0 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      overflow: hidden;
    }
    .offline-status .progress-bar {
      display: block;
      height: 100%;
      width: 0%;
      background: #ff9800;
      border-radius: 4px;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="controls">
    <div class="download-panel" id="downloadPanel">
      <div class="dp-header" id="dpHeader" title="Minimizar / expandir">
        <span class="dp-title">Descargar mapa</span>
        <button id="dpToggle" type="button" class="dp-toggle">−</button>
      </div>
      <div class="dp-body">
        <label for="zoomLevel">Hasta el zoom</label>
        <select id="zoomLevel">
          <option value="13">13 - calles y barrios</option>
          <option value="14">14 - calles principales</option>
          <option value="15">15 - calles detalladas</option>
          <option value="16">16 - detalle completo</option>
          <option value="17">17 - detalle fino (pesado)</option>
        </select>
        <small id="zoomInfo"></small>
      </div>
    </div>
    <div class="pins-panel" id="pinsPanel">
      <span class="pins-title">Mis ubicaciones</span>
      <div class="pins-form">
        <input type="text" id="pinName" placeholder="Nombre del lugar" maxlength="40" />
        <select id="pinColor">
          <option value="#e63946">Rojo</option>
          <option value="#457b9d">Azul</option>
          <option value="#2a9d8f">Verde</option>
          <option value="#e9c46a">Amarillo</option>
          <option value="#9b5de5">Morado</option>
        </select>
        <button id="pinAddBtn" type="button">+ Añadir pin en el mapa</button>
        <small class="hint" id="pinHint"></small>
      </div>
      <ul id="pinList"></ul>
    </div>
  </div>
  <div id="offline-status" class="offline-status" hidden></div>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="offline.js"></script>
  <script>
    'use strict';

    var HAVANA_BOUNDS = L.latLngBounds([22.9337108, -82.6072626], [23.3857728, -82.0814213]);
    var MIN_ZOOM = 12;
    var MAX_DOWNLOAD_ZOOM = 17;

    function readStoredZoom() {
      try {
        var v = parseInt(localStorage.getItem('havanamap-maxzoom'), 10);
        return (v >= MIN_ZOOM && v <= MAX_DOWNLOAD_ZOOM) ? v : null;
      } catch (e) {
        return null;
      }
    }

    var downloadTargetZoom = readStoredZoom() || 16;
    var downloadSession = { active: false };

    function downloadZooms() {
      var zs = [];
      for (var z = MIN_ZOOM; z <= downloadTargetZoom; z += 1) zs.push(z);
      return zs;
    }

    var map = L.map('map', {
      center: HAVANA_BOUNDS.getCenter(),
      zoom: MIN_ZOOM,
      minZoom: MIN_ZOOM,
      maxZoom: downloadTargetZoom,
      maxBounds: HAVANA_BOUNDS,
      maxBoundsViscosity: 1,
      zoomControl: false
    });

    new OfflineTileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
      maxZoom: MAX_DOWNLOAD_ZOOM
    }).addTo(map);
    map.attributionControl.setPrefix(false);

    var statusEl = document.getElementById('offline-status');

    function setStatus(text, cls, pct) {
      statusEl.hidden = false;
      statusEl.classList.remove('ready', 'downloading', 'empty');
      if (cls) statusEl.classList.add(cls);
      var bar = '';
      if (pct !== undefined && pct !== null) {
        bar = '<span class="progress"><span class="progress-bar" style="width:' + pct + '%"></span></span>';
      }
      statusEl.innerHTML = '<span class="dot"></span><span class="status-text">' + text + '</span>' + bar;
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      var units = ['B', 'KB', 'MB', 'GB'];
      var i = Math.floor(Math.log(bytes) / Math.log(1024));
      if (i >= units.length) i = units.length - 1;
      return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }

    function refreshStatus() {
      HavanaTiles.getCacheInfo().then(function (info) {
        if (info.count > 0) {
          setStatus('Mapa disponible sin conexión: ' + info.count + ' tiles (' + formatBytes(info.bytes) + ')', 'ready');
        } else {
          setStatus('Mapa sin descargar: se descargará al cargar, requiere internet', 'empty');
        }
      }).catch(function () {
        setStatus('Almacenamiento no disponible', 'empty');
      });
    }

    function tilesForRect(zoom) {
      var topLeft = map.project(HAVANA_BOUNDS.getNorthWest(), zoom).divideBy(256).floor();
      var bottomRight = map.project(HAVANA_BOUNDS.getSouthEast(), zoom).divideBy(256).floor();
      var tiles = [];
      for (var x = topLeft.x; x <= bottomRight.x; x += 1) {
        for (var y = topLeft.y; y <= bottomRight.y; y += 1) {
          tiles.push({
            key: zoom + '/' + x + '/' + y,
            url: 'https://a.tile.openstreetmap.org/' + zoom + '/' + x + '/' + y + '.png'
          });
        }
      }
      return tiles;
    }

    function allTiles() {
      var tiles = [];
      downloadZooms().forEach(function (z) {
        tiles = tiles.concat(tilesForRect(z));
      });
      return tiles;
    }

    function totalTilesFor(maxZoomLevel) {
      var n = 0;
      for (var z = MIN_ZOOM; z <= maxZoomLevel; z += 1) {
        n += tilesForRect(z).length;
      }
      return n;
    }

    function downloadWithLimit(db, tiles, session, onProgress) {
      var MAX_CONCURRENT = 8;
      var index = 0;
      var processed = 0;
      var total = tiles.length;

      function report() {
        if (session.active && onProgress) onProgress(processed, total);
      }

      function processOne(t) {
        if (!session.active) return Promise.resolve();
        return HavanaTiles.getTile(db, t.key)
          .then(function () { processed += 1; report(); })
          .catch(function () {
            if (!session.active) return Promise.resolve();
            var controller = window.AbortController ? new AbortController() : null;
            var timer = controller === null ? null : setTimeout(function () { controller.abort(); }, 20000);
            var opts = { credentials: 'omit' };
            if (controller) opts.signal = controller.signal;
            function clearTimer() { if (timer) clearTimeout(timer); }
            return fetch(t.url, opts)
              .then(function (res) {
                clearTimer();
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.blob();
              })
              .then(function (blob) {
                return new Promise(function (resolveTx, rejectTx) {
                  var tx = db.transaction(HavanaTiles.STORE, 'readwrite');
                  tx.objectStore(HavanaTiles.STORE).put(blob, t.key);
                  tx.oncomplete = function () { resolveTx(); };
                  tx.onerror = function () { rejectTx(tx.error); };
                  tx.onabort = function () { rejectTx(tx.error); };
                });
              })
              .catch(function () {})
              .then(function () { processed += 1; report(); });
          });
      }

      function worker() {
        function run() {
          if (!session.active || index >= total) return Promise.resolve();
          var t = tiles[index];
          index += 1;
          return processOne(t).then(run);
        }
        return run();
      }

      var workers = [];
      for (var w = 0; w < Math.min(MAX_CONCURRENT, total); w += 1) {
        workers.push(worker());
      }
      return Promise.all(workers);
    }

    var downloadRunning = false;

    function ensureOffline() {
      if (downloadRunning) return;
      downloadRunning = true;
      var session = { active: true };
      downloadSession = session;

      var tiles;
      try {
        tiles = allTiles();
      } catch (e) {
        console.error('Error al preparar la descarga:', e);
        refreshStatus();
        return;
      }
      var total = tiles.length;

      HavanaTiles.getCacheInfo().then(function (info) {
        if (!session.active) return;
        if (info.count >= total) { markComplete(); return; }
        var baseMsg = info.count > 0
          ? 'Completando descarga de La Habana...'
          : 'Descargando todo el mapa de La Habana...';
        setStatus(baseMsg + ' (0/' + total + ')', 'downloading', 0);
        return HavanaTiles.openDB().then(function (db) {
          return downloadWithLimit(db, tiles, session, function (done, t) {
            var pct = done === 0 ? 0 : Math.floor(done * 100 / t);
            setStatus('Descargando el mapa de La Habana... ' + pct + '% (' + done + '/' + t + ')', 'downloading', pct);
          });
        });
      }).then(function () {
        if (session.active) markComplete();
      }, function (err) {
        console.error('Error en la descarga offline:', err);
        if (session.active) refreshStatus();
      });
    }

    var zoomSelect = document.getElementById('zoomLevel');
    var zoomInfoEl = document.getElementById('zoomInfo');

    var downloadPanel = document.getElementById('downloadPanel');
    var dpToggle = document.getElementById('dpToggle');

    function collapsePanel() {
      downloadPanel.classList.add('collapsed');
      dpToggle.textContent = '+';
    }

    function expandPanel() {
      downloadPanel.classList.remove('collapsed');
      dpToggle.textContent = '−';
    }

    function isFullyDownloaded() {
      return HavanaTiles.getCacheInfo().then(function (info) {
        return info.count >= totalTilesFor(downloadTargetZoom);
      }).catch(function () { return false; });
    }

    function markComplete() {
      refreshStatus();
      isFullyDownloaded().then(function (full) { if (full) collapsePanel(); });
    }

    dpToggle.addEventListener('click', function (e) {
      e.stopPropagation();
      if (downloadPanel.classList.contains('collapsed')) expandPanel();
      else collapsePanel();
    });
    document.getElementById('dpHeader').addEventListener('click', function () {
      if (downloadPanel.classList.contains('collapsed')) expandPanel();
      else collapsePanel();
    });

    function applyZoomChoice() {
      var v = parseInt(zoomSelect.value, 10);
      if (!(v >= MIN_ZOOM && v <= MAX_DOWNLOAD_ZOOM)) return;
      downloadTargetZoom = v;
      try { localStorage.setItem('havanamap-maxzoom', String(v)); } catch (e) {}
      map.setMaxZoom(v);
      zoomInfoEl.textContent = '≈ ' + totalTilesFor(v).toLocaleString() + ' tiles';
      expandPanel();
      downloadSession.active = false;
      downloadRunning = false;
      ensureOffline();
    }

    zoomSelect.addEventListener('change', applyZoomChoice);
    zoomSelect.value = String(downloadTargetZoom);
    zoomInfoEl.textContent = '≈ ' + totalTilesFor(downloadTargetZoom).toLocaleString() + ' tiles';

    setTimeout(function () {
      map.invalidateSize();
      map.fitBounds(HAVANA_BOUNDS, { padding: [10, 10] });
    }, 100);

    // Iniciar la descarga completa en cuanto se entra a la página,
    // sin depender del evento 'load' del mapa.
    setTimeout(ensureOffline, 500);

    // Si el mapa ya está completo, minimizar el panel de descarga.
    isFullyDownloaded().then(function (full) { if (full) collapsePanel(); });

    // Registrar el Service Worker para poder abrir la página sin conexión
    // (si ya se ha visitado una vez con internet).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.error('Error al registrar el service worker:', err);
        });
      });
    }

    /* ===== Ubicaciones guardadas (pines) ===== */
    var PIN_KEY = 'havanamap-pins';
    var pins = loadPins();
    var pinMode = false;
    var editingPinId = null;
    var pinLayer = L.layerGroup().addTo(map);
    var pinNameInput = document.getElementById('pinName');
    var pinColorInput = document.getElementById('pinColor');
    var pinAddBtn = document.getElementById('pinAddBtn');
    var pinHint = document.getElementById('pinHint');
    var pinListEl = document.getElementById('pinList');

    function loadPins() {
      try {
        var raw = localStorage.getItem(PIN_KEY);
        var arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function savePins() {
      try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch (e) {}
    }

    function findPin(id) {
      for (var i = 0; i < pins.length; i += 1) {
        if (String(pins[i].id) === String(id)) return pins[i];
      }
      return null;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function resetPinForm() {
      editingPinId = null;
      pinMode = false;
      pinNameInput.value = '';
      pinColorInput.value = '#e63946';
      pinAddBtn.classList.remove('active');
      pinAddBtn.textContent = '+ Añadir pin en el mapa';
      map.getContainer().style.cursor = '';
      pinHint.textContent = '';
    }

    function makePinsDot(color) {
      var d = document.createElement('span');
      d.className = 'pin-dot';
      d.style.background = color;
      return d;
    }

    function renderPins() {
      pinLayer.clearLayers();
      pinListEl.innerHTML = '';
      pins.forEach(function (p) {
        var marker = L.circleMarker([p.lat, p.lng], {
          radius: 10,
          color: '#fff',
          weight: 2,
          fillColor: p.color,
          fillOpacity: 1
        }).addTo(pinLayer);
        marker.bindPopup(
          '<strong>' + escapeHtml(p.name) + '</strong><br>' +
          '<span style="color:#999">' + p.lat.toFixed(5) + ', ' + p.lng.toFixed(5) + '</span>'
        );

        var li = document.createElement('li');
        li.appendChild(makePinsDot(p.color));
        var name = document.createElement('span');
        name.className = 'pin-name';
        name.textContent = p.name;
        li.appendChild(name);

        var buttons = [
          { cls: 'pin-go', text: 'Ir' },
          { cls: 'pin-edit', text: 'Editar' },
          { cls: 'pin-del', text: '✕' }
        ];
        buttons.forEach(function (b) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = b.cls;
          btn.textContent = b.text;
          btn.dataset.id = p.id;
          li.appendChild(btn);
        });
        pinListEl.appendChild(li);
      });
      if (pins.length === 0 && !pinHint.textContent) {
        pinHint.textContent = 'Aún no hay ubicaciones guardadas.';
      }
    }

    pinAddBtn.addEventListener('click', function () {
      if (editingPinId !== null) {
        var pin = findPin(editingPinId);
        if (pin) {
          var newName = pinNameInput.value.trim();
          if (newName) pin.name = newName;
          pin.color = pinColorInput.value;
          savePins();
        }
        resetPinForm();
        renderPins();
        return;
      }
      pinMode = !pinMode;
      pinAddBtn.classList.toggle('active', pinMode);
      pinAddBtn.textContent = pinMode
        ? 'Haz clic en el mapa para colocar el pin'
        : '+ Añadir pin en el mapa';
      map.getContainer().style.cursor = pinMode ? 'crosshair' : '';
      pinHint.textContent = pinMode
        ? 'Haz clic en cualquier punto del mapa.'
        : (pins.length === 0 ? 'Aún no hay ubicaciones guardadas.' : '');
    });

    map.on('click', function (e) {
      if (!pinMode) return;
      var name = pinNameInput.value.trim() || ('Ubicación ' + (pins.length + 1));
      pins.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        name: name,
        lat: e.latlng.lat,
        lng: e.latlng.lng,
        color: pinColorInput.value
      });
      savePins();
      renderPins();
      pinMode = false;
      pinAddBtn.classList.remove('active');
      pinAddBtn.textContent = '+ Añadir pin en el mapa';
      pinHint.textContent = 'Pin guardado en ' + e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5);
    });

    pinListEl.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('button') : null;
      if (!btn || !btn.dataset.id) return;
      var pin = findPin(btn.dataset.id);
      if (!pin) return;
      if (btn.classList.contains('pin-go')) {
        map.setView([pin.lat, pin.lng], 17);
      } else if (btn.classList.contains('pin-edit')) {
        editingPinId = pin.id;
        pinNameInput.value = pin.name;
        pinColorInput.value = pin.color;
        pinAddBtn.classList.remove('active');
        pinAddBtn.textContent = 'Guardar cambios';
        pinHint.textContent = 'Editando: cambia nombre o color y pulsa "Guardar cambios".';
        pinMode = false;
        map.getContainer().style.cursor = '';
      } else if (btn.classList.contains('pin-del')) {
        pins = pins.filter(function (p) { return String(p.id) !== String(pin.id); });
        savePins();
        if (String(editingPinId) === String(pin.id)) resetPinForm();
        renderPins();
      }
    });

    renderPins();

    refreshStatus();
  </script>
</body>
</html>
