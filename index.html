<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de La Habana, Cuba</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { width: 100%; height: 100vh; background: #ccc; }
    .btn-zoom { position: absolute; top: 10px; left: 10px; z-index: 1000; }
    .btn-zoom button { margin: 5px; padding: 5px 10px; }
    .attribution { position: absolute; bottom: 10px; left: 10px; font-size: 12px; width: auto; }
  </style>
</head>
<body>
<div class="attribution">&copy; <a href="https://www.stamen.com/">Stamen Design</a>, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></div>
  <div id="map"></div>
  <div class="btn-zoom">
    <button id="zoomIn">+</button>
    <button id="zoomOut">-</button>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    'use strict';
    const map = L.map('map', { center: [23.1364, -82.3686], zoom: 15, zoomControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }).addTo(map);
    map.attributionControl.setPrefix(false);

    document.getElementById('zoomIn').addEventListener('click', () => map.zoomIn());
    document.getElementById('zoomOut').addEventListener('click', () => map.zoomOut());

    // Forzar redibujado después de un pequeño retraso
    setTimeout(() => { map.invalidateSize(); }, 100);
  </script>
</body>
</html>
